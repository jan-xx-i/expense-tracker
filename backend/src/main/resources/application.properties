# ===== Server =====
server.port=${SERVER_PORT:8080}

# ===== MySQL Database =====
# Create the database first: CREATE DATABASE expense_tracker;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_tracker?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# update = auto-creates/updates tables from your entities. Good for learning/dev.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
# Override JWT_SECRET via environment variable in production. Never commit real secrets.
jwt.secret=${JWT_SECRET:ThisIsADevOnlySecretKeyChangeItBeforeDeployingToProduction123!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===== CORS =====
app.cors.allowed-origin=${CORS_ORIGIN:http://127.0.0.1:5500}
